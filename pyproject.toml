[project]
name = "factory"
version = "0.1.0"
description = "Coil & Cog AI Content Factory: a CLI pipeline for faceless 'how machines work' explainer videos"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "en-core-web-sm",
    "google-genai>=2.33.0",
    "jinja2>=3.1.6",
    "kokoro>=0.9.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
    "torch>=2.14.1",
    "typer>=0.27.3",
]

[project.scripts]
factory = "factory.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # lets tests import helpers as `from fakes.fake_gemini import ...`
markers = [
    "slow: media tests that run ffmpeg on fixture clips",
    "integration: calls a real external API; run manually",
]
addopts = "-m 'not integration'"

# PyTorch (needed by Kokoro) from PyTorch's CPU-only index: the default Linux wheels bundle
# several GB of NVIDIA CUDA libraries, and this PC has no NVIDIA GPU (D-059).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
